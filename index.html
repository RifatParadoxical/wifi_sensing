<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSI Real-Time Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div style="width: 80%; margin: auto;">
        <canvas id="csiChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('csiChart').getContext('2d');
        const csiChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Subcarrier indices will go here
                datasets: [{
                    label: 'Subcarrier Amplitude',
                    data: [],
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.1
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });

        // Connect to the Python WebSocket server on the current host.
        const ws = new WebSocket(`ws://${window.location.hostname}:8765`);

        ws.onmessage = function(event) {
            const amplitudes = JSON.parse(event.data);
            
            // Populate X-axis labels dynamically on the first payload
            if (csiChart.data.labels.length !== amplitudes.length) {
                csiChart.data.labels = Array.from({length: amplitudes.length}, (_, i) => i);
            }
            
            // Update chart data and redraw
            csiChart.data.datasets[0].data = amplitudes;
            csiChart.update('none'); // 'none' prevents animation lag at high speeds
        };

        ws.onerror = (error) => console.error("WebSocket Error:", error);
    </script>
</body>
</html>
